{% load static%}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiManage - Formulários</title>
    <link rel="stylesheet" href="{% static 'logimanageapp/css/formularios.css'%}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'logimanageapp/css/sidebar.css' %}"> <!-- Link para o CSS da sidebar -->
</head>
<body>
    <div class="painel-de-controle">
        {% include 'logimanageapp/includes/sidebar.html' %} <!-- Incluindo a sidebar -->

        <!-- Conteúdo Principal -->
        <div class="main-content">
            <h1 class="page-title">Formulários</h1>
            
            <!-- Lista de Formulários -->
            <div class="formularios-container">
                <!-- Formulário 1 -->
                <div class="formulario-card">
                    <div class="formulario-header">
                        <div class="formulario-icon">
                            <img src="{% static 'logimanageapp/imgs/imagem-formularios.svg'%}" alt="Ícone Formulário">
                        </div>
                        <div class="formulario-info">
                            <h3>Requisição</h3>
                            <p>Requisição de Transporte Aéreo de Carga</p>
                        </div>
                    </div>
                    <div class="formulario-actions">
                        <a href="#" class="formulario-button abrir">
                            <i class="fas fa-external-link-alt"></i> Abrir
                        </a>
                        <a href="#" class="formulario-button download">
                            <i class="fas fa-download"></i> Download
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
