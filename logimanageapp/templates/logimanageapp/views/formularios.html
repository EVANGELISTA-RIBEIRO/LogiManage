{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiManage - Formulários</title>
    <link rel="stylesheet" href="{% static 'logimanageapp/css/formularios.css'%}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'logimanageapp/css/sidebar.css' %}">
    <link rel="stylesheet" href="{% static 'logimanageapp/css/modal_forms.css' %}"> {# NOVO: CSS para o modal #}
</head>
<body>
    <div class="painel-de-controle">
        {% include 'logimanageapp/includes/sidebar.html' %}

        <div class="main-content">
            <h1 class="page-title">Formulários</h1>
            
            <div class="formularios-container">
                <div class="formulario-card">
                    <div class="formulario-header">
                        <div class="formulario-icon">
                            <img src="{% static 'logimanageapp/imgs/imagem-formularios.svg'%}" alt="Ícone Formulário">
                        </div>
                        <div class="formulario-info">
                            <h3>Requisição</h3>
                            <p>Requisição de Transporte Aéreo de Carga</p>
                        </div>
                    </div>
                    <div class="formulario-actions">
                        <button class="formulario-button abrir" id="btn-abrir-requisicao">
                            <i class="fas fa-external-link-alt"></i> Abrir
                        </button>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="transportNumberModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Gerar Documento de Requisição</h2>
            <p>Por favor, insira o Número da Requisição (ID):</p>
            <input type="number" id="requisicaoIdInput" placeholder="Ex: 123" min="1">
            <button id="confirmGenerateDoc" class="btn-modal-confirm">Gerar Documento</button>
            <button id="cancelGenerateDoc" class="btn-modal-cancel">Cancelar</button>
        </div>
    </div>

    <script src="{% static 'logimanageapp/js/formularios.js' %}"></script> {# NOVO: Link para o JS #}
</body>
</html>
