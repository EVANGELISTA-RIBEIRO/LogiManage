{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'logimanageapp/css/login.css' %}">
    <title>Login - LogiManage</title>
</head>
<body>
    <div class="login">
        <div class="logo">
            <img class="icon" alt="" src="{% static 'logimanageapp/imgs/logo_grande.png' %}">
            <div class="logimanage">LogiManage</div>
        </div>
        <div class="content">
            <div class="header">
                <img class="icon1" alt="" src="{% static 'logimanageapp/imgs/logo_pequena.png' %}">
                <div class="text-and-supporting-text">
                    <div class="text">Entre com sua conta</div>
                    <div class="supporting-text">Seja Bem-vindo!</div>
                </div>
            </div>
            <div class="content1">
                <form method="POST" action="{% url 'logar_usuario' %}">
                    {% csrf_token %}
                    
                    {% for field in form %}
                    <div class="input-field">
                        {{ field.label_tag }}
                        {{ field }}
                        {% for error in field.errors %}
                            <div class="error">{{ error }}</div>
                        {% endfor %}
                    </div>
                    {% endfor %}
                    
                    <div class="actions">
                        <div class="button">
                            <button type="submit" class="button-base">Entrar</button>
                        </div>
                        <div class="row">
                            <div class="text4">Não tem uma conta?</div>
                            <div class="button1">
                                <a class="button-base1" href="{% url 'registro' %}" style="text-decoration: none;">Registrar-se</a>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
