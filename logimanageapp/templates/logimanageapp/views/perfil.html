{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiManage - Perfil</title>
    <link rel="stylesheet" href="{% static 'logimanageapp/css/perfil.css' %}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="{% static 'logimanageapp/css/sidebar.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="painel-de-controle">
        {% include 'logimanageapp/includes/sidebar.html' %}

        <div class="main-content">
            <div class="profile-container">
                <div class="profile-header">
                    <h1>Meu Perfil</h1>
                    <div class="date-display">
                        <time datetime="{{ 'now'|date:'Y-m-d' }}">{% now "l, d \d\e F \d\e Y" %}</time> 
                    </div>
                </div>

                <div class="profile-content">
                    <form class="profile-form" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="profile-image-upload">
                            <img src="{{ user.profile.image.url }}" alt="Foto de Perfil" class="profile-avatar">
                            
                            <label for="id_image" class="upload-button">
                                <i class="fas fa-camera"></i> Alterar Foto
                            </label>
                            
                            {# NOVO: Renderiza o input normal e o esconde com CSS #}
                            <div style="display: none;">
                                {{ form.image }}
                            </div>
                            
                        </div>

                        <div class="form-group">
                            <label for="username">Nome de Usuário</label>
                            <input type="text" id="username" value="{{ user.username }}" readonly>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" value="{{ user.email }}" readonly>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="save-button">Salvar Alterações</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // O ID do input de arquivo do Django é sempre 'id_nome_do_campo'
            const profileImageInput = document.getElementById('id_image'); 
            const profileAvatar = document.querySelector('.profile-avatar');

            if (profileImageInput && profileAvatar) {
                profileImageInput.addEventListener('change', function(event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            profileAvatar.src = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }
        });
    </script>
</body>
</html>
